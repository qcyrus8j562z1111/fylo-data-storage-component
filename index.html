<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Frontend Mentor - Fylo data storage component</title>

  </head>

  <body>
    <main class="storage-component">
      <section class="fylo-card">
        <img src="./images/logo.svg" alt="Fylo">

        <div class="fylo-actions">

          <div class="action-icon">
            <img src="./images/icon-document.svg" alt="">
          </div>

          <div class="action-icon">
            <img src="./images/icon-folder.svg" alt="">
          </div>

          <div class="action-icon">
            <img src="./images/icon-upload.svg" alt="">
          </div>
        </div>
      </section>
      
      <section class="storage-card">
        <p class="storage-message">
          You've used <strong>815 GB</strong> of your storage
        </p>

        <div class="storage-bar">
          <div class="storage-bar-fill"></div>
        </div>

        <div class="storage-limits">
          <strong>0 GB</strong>
          <strong>1000 GB</strong>
        </div>

        <div class="storage-remaining">
          <strong>185</strong>
          <span>GB Left</span>
        </div>
      </section>

    </main>
   
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Quentin Cyrus</a>.
  </footer>

  </body>
</html>
